# config.yaml

# --- Model & Tokenizer Paths ---
model_paths:
  honest_prover_name_or_path: "gpt2"             # Path or HF ID for Model A
  sneaky_prover_name_or_path: "gpt2-medium"      # Path or HF ID for Model B
  verifier_name_or_path: "gpt2-medium"      # Path or HF ID for Verifier
  tokenizer: null             # Optional: Path/ID if different from model_a, null uses model_a's path

# --- DeepSpeed Configurations ---
deepspeed_configs:
  config_honest_prover: "ds_config_zero3.json" # Path to DS config for Model A training
  config_sneaky_prover: "ds_config_zero3.json" # Path to DS config for Model B training

# --- Data Paths ---
data:
  train_file: "path/to/your/train.jsonl"    # REQUIRED: Update this path
  validation_file: "path/to/your/valid.jsonl" # Optional: Update this path or set to null

# --- Output & Logging ---
output:
  dir: "./output_disjoint_training_yaml" # Output directory
  logging_steps: 100
  save_steps: 500
  eval_steps: 500

# --- Core Training Parameters ---
training:
  seed: 42
  max_train_steps: null       # Set to override epochs
  num_train_epochs: 1         # Number of training epochs
  per_device_train_batch_size: 4         # Per-device batch size for training
  per_device_eval_batch_size: 4          # Per-device batch size for evaluation
  gradient_accumulation_steps: 1
  gradient_checkpointing: false # TODO: check implementation for gradient checkpointing
  mixed_precision: "bf16"     # Optional: "fp16", "bf16", or null

# --- Optimizer & Scheduler Parameters ---
optimizer:
  learning_rate_a: 5.0e-5
  learning_rate_b: 5.0e-5
  lr_scheduler_type: "linear" # e.g., linear, cosine, constant
  num_warmup_steps: 0
  weight_decay_a: 0.01
  weight_decay_b: 0.01
  max_grad_norm_a: 1.0        # Optional: Max grad norm for A, null to disable
  max_grad_norm_b: 1.0        # Optional: Max grad norm for B, null to disable

# --- vLLM Server & Generation Parameters ---
vllm:
  a:
    host: "127.0.0.1"         # Host for vLLM Server A (use IP if different machine)
    port: 8000
    max_new_tokens: 64          # Max tokens for vLLM generation
    temperature: 0.7            # Sampling temperature for vLLM
  b:
    host: "127.0.0.1"         # Host for vLLM Server B
    port: 8001
    max_new_tokens: 64          # Max tokens for vLLM generation
    temperature: 0.7            # Sampling temperature for vLLM
  c:
    host: "127.0.0.1"         # Host for vLLM Server B
    port: 8002
    max_new_tokens: 64          # Max tokens for vLLM generation
    temperature: 0.7            # Sampling temperature for vLLM

  server_timeout: 60.0        # Seconds to wait for servers

# --- Checkpointing ---
checkpointing:
  resume_from_checkpoint: null # Optional: Path to checkpoint dir to resume from